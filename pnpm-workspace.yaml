packages:
  - 'packages/*'

# Drops drizzle-kit's vestigial, deprecated @esbuild-kit/esm-loader (it loads TS
# configs via tsx, never imports esbuild-kit). See docs/testing.md. Remove once
# drizzle-kit >0.31.10 drops the dead dep.
#
# Lives here, not in package.json's `pnpm` block: pnpm 11 ignores that field.
overrides:
  'drizzle-kit>@esbuild-kit/esm-loader': npm:tsx@^4
