# REFERENCE COPY of /etc/nginx/sites-available/diet.mase.fi, verbatim. nginx
# does not read this file; it is kept so the vhost can be recreated exactly on
# a box rebuild. The live file carries no secret: the API bearer comes from
# /etc/nginx/secrets/diet.conf (root, mode 600), which holds one line,
#   set $diet_api_token "<API_TOKEN from .env>";
# Also required: snippets/security-headers.conf (the six common headers) and
# the $immutable_cc map in conf.d/cache-control-map.conf.
#
# diet.mase.fi — Ruoka: spoilage-first meal planning
#
# Auth-gated at the edge: nginx auth_request -> central-hub's session check,
# the same gate prospect/st/sm use. The app itself has no login UI; signing in
# at db.mase.fi authenticates this host too (the session cookie is .mase.fi).
#
# The browser never holds the API token: nginx injects the Authorization
# header on /api/ AFTER the auth subrequest passes. The API keeps its own
# bearer check, so the edge gate and the application gate are independent —
# a misconfigured location block cannot expose the API to anonymous traffic.
#
# Frontend and API are same-origin here (diet.mase.fi/ and diet.mase.fi/api/),
# so CORS is not involved. Non-browser clients (cron, a future scanner) still
# use the bearer token directly; cookie SSO is not available to them.

# HTTP redirect
server {
    listen 80;
    listen [::]:80;
    server_name diet.mase.fi;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diet.mase.fi;

    # Diet API bearer token lives in a root-only include (finding #6443).
    # /etc/nginx/secrets/diet.conf is mode 600 — never paste the token here.
    include /etc/nginx/secrets/diet.conf;

    root /var/www/diet.mase.fi;
    index index.html;

    access_log /var/log/nginx/diet.mase.fi.access.log;
    error_log /var/log/nginx/diet.mase.fi.error.log;

    ssl_certificate /etc/ssl/cloudflare/mase.fi.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mase.fi.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://mase.fi; img-src 'self' data:; font-src 'self' https://mase.fi; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # A location with its own add_header inherits NONE of the above, so every
    # location that sets one (even just Cache-Control) must also include
    # snippets/security-headers.conf and repeat the CSP line.

    client_max_body_size 2M;

    # Central Hub auth subrequest — the gate. Cookie forwarding is REQUIRED:
    # central-hub validates the .mase.fi session cookie, and without this line
    # every request 401s. Do not drop it.
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:3200/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # Public by design: the deploy health gate, nginx and uptime monitoring hit
    # this with no cookie. Exact-match so it wins over the /api/ prefix below.
    location = /api/health {
        # Uptime monitoring must see the service's real state, not a cached
        # "ok" from before it fell over. The API sets no cache headers itself.
        add_header Cache-Control "no-store" always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://mase.fi; img-src 'self' data:; font-src 'self' https://mase.fi; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:3300/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /_auth;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3300/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer $diet_api_token";
    }

    # Vite's content-hashed filenames prove their own freshness.
    location /assets/ {
        auth_request /_auth;
        add_header Cache-Control $immutable_cc always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://mase.fi; img-src 'self' data:; font-src 'self' https://mase.fi; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # SPA shell: every route serves index.html, which must revalidate so a
    # deploy is never served stale without a hard refresh.
    location / {
        auth_request /_auth;
        # A raw 401 page is a dead end for a browser, so an unauthenticated
        # HTML request is sent somewhere it can actually sign in. Scoped to
        # this block on purpose: /api/ must keep answering 401, because the
        # app's fetch client reloads on one (following a redirect there would
        # hand it a login page with status 200). No return target is passed —
        # central-hub's /login?redirect= takes an in-app path, not a
        # cross-host URL, and the .mase.fi session cookie makes coming back
        # here work anyway.
        error_page 401 = @login;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://mase.fi; img-src 'self' data:; font-src 'self' https://mase.fi; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location @login {
        # Never cached: this redirect is a statement about the CURRENT request's
        # cookie, and a cached copy would tell a signed-in visitor to sign in.
        add_header Cache-Control "no-store" always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://mase.fi; img-src 'self' data:; font-src 'self' https://mase.fi; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        return 302 https://db.mase.fi/login;
    }
}
